<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Request CrawlLoom access</title><link rel="stylesheet" href="/info/info.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="/">Crawl<span>Loom</span></a></div></header><main><section class="card"><p class="eyebrow">Early access</p><h1>Request access to CrawlLoom</h1><p>Enter your name and email. We’ll send a verification link to confirm your address.</p><form id="signupForm"><label>Name<input name="name" required maxlength="160" autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><button class="primary-link" type="submit">Email me a verification link</button><p id="message" role="status"></p></form></section></main><script>const f=document.querySelector('form'),m=document.querySelector('#message');f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;m.textContent='Sending…';try{const r=await fetch('/api/public/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(!r.ok)throw Error(d.error);f.innerHTML='<p class="notice">If the address can receive mail, a verification link is on its way. Please check your inbox and spam folder.</p>'}catch(x){m.textContent=x.message||'Could not send the email.';b.disabled=false}})</script></body></html>
