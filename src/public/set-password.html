<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Create your CrawlLoom password</title><link rel="stylesheet" href="/info/info.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="/">Crawl<span>Loom</span></a></div></header><main><section class="card"><p class="eyebrow">Email verified</p><h1>Create your password</h1><p>Your account will be created with Auditor access.</p><form id="passwordForm"><label>Password<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Confirm password<input name="confirm" type="password" minlength="12" required autocomplete="new-password"></label><button class="primary-link" type="submit">Create account</button><p id="message" role="alert"></p></form></section></main><script>const f=document.querySelector('form'),m=document.querySelector('#message'),token=new URLSearchParams(location.search).get('token')||'';f.addEventListener('submit',async e=>{e.preventDefault();const p=f.password.value;if(p!==f.confirm.value){m.textContent='Passwords do not match.';return}try{const r=await fetch('/api/public/set-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})}),d=await r.json();if(!r.ok)throw Error(d.error);m.innerHTML='Account created. <a href="/admin/login">Sign in to CrawlLoom</a>.';f.remove()}catch(x){m.textContent=x.message||'Could not create your account.'}})</script></body></html>
